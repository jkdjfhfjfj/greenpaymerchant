kind = "web"
previewPath = "/"
title = "Greenpay Payments Console"
description = "Greenpay payments workspace for payment links, confirmed transactions, settlement forecasts, finance operations and developer access."
version = "1.0.0"
id = "artifacts/payrail-console"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19984

[services.development]
run = "pnpm --filter @workspace/payrail-console run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/payrail-console", "run", "build" ]
serve = "static"
publicDir = "artifacts/payrail-console/dist/public"

[[services.production.rewrites]]
from = "/contact"
to = "/contact/index.html"

[[services.production.rewrites]]
from = "/contact/"
to = "/contact/index.html"

[[services.production.rewrites]]
from = "/about"
to = "/about/index.html"

[[services.production.rewrites]]
from = "/about/"
to = "/about/index.html"

[[services.production.rewrites]]
from = "/api-docs"
to = "/api-docs/index.html"

[[services.production.rewrites]]
from = "/api-docs/"
to = "/api-docs/index.html"

[[services.production.rewrites]]
from = "/sign-in"
to = "/sign-in/index.html"

[[services.production.rewrites]]
from = "/sign-in/"
to = "/sign-in/index.html"

[[services.production.rewrites]]
from = "/sign-up"
to = "/sign-up/index.html"

[[services.production.rewrites]]
from = "/sign-up/"
to = "/sign-up/index.html"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19984"
BASE_PATH = "/"
