    <meta name="description" content="Greenpay helps businesses collect payments with links and review confirmed transactions, settlement evidence, invoices, refunds and payout records." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://empty-project.replit.app/" />
    <meta property="og:site_name" content="Greenpay" />
    <meta property="og:title" content="Greenpay | Payment collection and business finance records" />

    <meta name="twitter:card" content="summary" />

    <meta name="twitter:description" content="Greenpay helps businesses collect payments with links and review confirmed transactions, settlement evidence, invoices, refunds and payout records." />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://empty-project.replit.app/#organization",
            "name": "Greenpay",
            "url": "https://empty-project.replit.app/"
          },
          {
            "@type": "WebSite",
            "@id": "https://empty-project.replit.app/#website",
            "name": "Greenpay",
            "url": "https://empty-project.replit.app/",
            "publisher": {
              "@id": "https://empty-project.replit.app/#organization"
            }
          }
        ]
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (() => {
        const privateSurface = /\/(?:api|admin|merchant|customers|transactions|invoices|receipts|payment-links|wallets|payouts|payout-requests|team|pay|receipt|status|sign-in|sign-up|profile|notifications|statements|cases|developers|settings|operations|settlements|support|exchange|webhooks)(?:\/|$)/i.test(window.location.pathname);
        if (privateSurface) {
          const robots = document.querySelector('meta[name="robots"]');
          if (robots) robots.content = 'noindex, nofollow';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

  </body>
