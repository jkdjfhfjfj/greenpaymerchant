      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Verified merchant transaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
  /v1/fx-quote:
    get:
      operationId: getDeveloperFxQuote
      tags: [developer-api]
      summary: Calculate an FX quote using the key's merchant pricing
      security: [{ bearerAuth: [] }]
      parameters:
        - name: amount
          in: query
          required: true
          schema: { type: number, exclusiveMinimum: 0 }
        - name: from
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 3 }
        - name: to
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 3 }
      responses:
        "200":
          description: Merchant FX quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FxQuote" }
  /v1/fees:
    get:
      operationId: getDeveloperFees
      tags: [developer-api]
      summary: Read the current merchant's platform pricing
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Merchant fee schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeScheduleResponse" }
