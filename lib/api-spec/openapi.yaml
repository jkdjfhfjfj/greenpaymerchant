openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: International payments collection, link, payout, settlement and operations API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: dashboard
  - name: transactions
  - name: payment-links
  - name: payouts
  - name: settlements
  - name: customers
  - name: webhooks
  - name: providers
  - name: merchant
  - name: legal
  - name: developer-api
  - name: admin
  - name: kyc
  - name: fx
  - name: wallets
  - name: payout-requests
paths:
  /contact/tickets:
    post:
      operationId: createContactTicket
      tags: [support]
      summary: Submit a public support request without exposing ticket-thread reads
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactTicketInput" }
      responses:
        "201":
          description: Support request recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactTicketReceipt" }
        "400": { description: Invalid input }
        "429": { description: Too many requests }
  /support/tickets:
    get:
      operationId: listSupportTickets
      tags: [support]
      summary: List support tickets belonging to the signed-in user
      responses:
        "200":
          description: The caller's support tickets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicketList" }
        "401": { description: Sign-in required }
    post:
      operationId: createSupportTicket
      tags: [support]
      summary: Create a signed-in user's support ticket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportTicketInput" }
      responses:
        "201":
          description: Created ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicket" }
  /support/tickets/{id}:
    get:
      operationId: getSupportTicket
      tags: [support]
      summary: Read a support ticket owned by the signed-in user
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Owned ticket and conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicketDetail" }
        "404": { description: Ticket not found }
  /support/tickets/{id}/messages:
    post:
      operationId: replySupportTicket
      tags: [support]
      summary: Add a message to the caller's support ticket
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportMessageInput" }
      responses:
        "201":
          description: Message added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportMessage" }
  /admin/support/tickets:
    get:
      operationId: adminListSupportTickets
      tags: [support, admin]
      summary: Search and filter the support inbox
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, in_progress, waiting, resolved, closed] }
        - name: search
          in: query
          schema: { type: string, maxLength: 120 }
      responses:
        "200":
          description: Support inbox
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicketList" }
        "403": { description: Administrator access required }
  /admin/support/tickets/{id}:
    get:
      operationId: adminGetSupportTicket
      tags: [support, admin]
      summary: Read any support ticket and its conversation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Ticket and conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicketDetail" }
        "404": { description: Ticket not found }
    patch:
      operationId: adminUpdateSupportTicket
      tags: [support, admin]
      summary: Update support ticket status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportTicketStatusInput" }
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportTicket" }
  /admin/support/tickets/{id}/messages:
    post:
      operationId: adminReplySupportTicket
      tags: [support, admin]
      summary: Reply to any support ticket
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportMessageInput" }
      responses:
        "201":
          description: Reply added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportMessage" }
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List persistent in-app notifications for the signed-in user
      responses:
        "200":
          description: User notifications and unread count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationList" }
  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark one owned notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }
        "404": { description: Notification not found }
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all owned notifications as read
      responses:
        "200":
          description: Current unread count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnreadCount" }
  /profile/business-contact:
    get:
      operationId: getBusinessContact
      tags: [profile]
      summary: Read the caller's editable merchant business contact details
      responses:
        "200":
          description: Business contact profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessContact" }
    put:
      operationId: updateBusinessContact
      tags: [profile]
      summary: Update the caller's business contact details without changing KYC ownership data
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessContactInput" }
      responses:
        "200":
          description: Updated business contact profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessContact" }
  /platform-status:
    get:
      operationId: getPlatformStatus
      tags: [health]
      summary: Read public Greenpay platform availability without exposing payment routes
      responses:
        "200":
          description: Platform operational status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformOperationalStatus" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Read dashboard metrics and recent activity
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List and filter payments
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, success, failed, cancelled, refunded]
        - name: currency
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionList"
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Start a payment using the configured currency route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Payment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionCreated"
  /transactions/{reference}:
    get:
      operationId: getTransaction
      tags: [transactions]
      summary: Read a payment and its settlement status
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found
  /transactions/{reference}/verify:
    post:
      operationId: verifyTransaction
      tags: [transactions]
      summary: Verify a payment with its provider
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Verified transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
  /transactions/{reference}/refund:
    post:
      operationId: refundTransaction
      tags: [transactions]
      summary: Record a full or partial refund
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundInput"
      responses:
        "201":
          description: Refund created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
  /payment-links:
    get:
      operationId: listPaymentLinks
      tags: [payment-links]
      summary: List payment links
      parameters:
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Payment links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLinkList"
    post:
      operationId: createPaymentLink
      tags: [payment-links]
      summary: Create a fixed-price or customer-entered payment link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentLinkInput"
      responses:
        "201":
          description: Link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLink"
  /payment-links/{id}:
    patch:
      operationId: updatePaymentLink
      tags: [payment-links]
      summary: Update or pause a payment link
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentLinkUpdate"
      responses:
        "200":
          description: Updated link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLink"
    delete:
      operationId: deletePaymentLink
      tags: [payment-links]
      summary: Archive a payment link
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Archived
  /public/payment-links/{slug}:
    get:
      operationId: getPublicPaymentLink
      tags: [payment-links]
      summary: Read a public payment link
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public payment link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPaymentLink"
        "404":
          description: Not found
  /public/payment-links/{slug}/checkout:
    post:
      operationId: checkoutPaymentLink
      tags: [payment-links]
      summary: Start a checkout session for a public payment link
      description: Customer-choice links may use any collection currency. Fixed-price and invoice links remain in their listed currency; no automatic conversion occurs. The server routes by currency and validates any selected payment method against that currency.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentLinkCheckoutInput"
      responses:
        "201":
          description: Checkout session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCheckoutSession"
        "400":
          description: Invalid currency, amount precision, or payment method for the payment link
        "503":
          description: The selected currency is not currently available for collection
  /public/transactions/{reference}:
    get:
      operationId: getPublicTransactionStatus
      tags: [transactions]
      summary: Verify a transaction for its customer checkout return
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public-safe payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicTransactionStatus"
        "404":
          description: Not found
  /wallets:
    get:
      operationId: listMerchantWallets
      tags: [wallets]
      summary: List funded merchant wallets by currency
      responses:
        "200":
          description: Funded wallets only; forecasts and unconfirmed collections are excluded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantWalletList" }
  /wallets/ledger:
    get:
      operationId: listMerchantWalletLedger
      tags: [wallets]
      summary: List posted wallet journal entries
      parameters:
        - name: currency
          in: query
          schema: { type: string, minLength: 3, maxLength: 3 }
      responses:
        "200":
          description: Append-only merchant wallet history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletLedgerList" }
  /wallets/fx-rates:
    get:
      operationId: listMerchantWalletFxRates
      tags: [wallets, fx]
      summary: List fresh reference rates from one supported base currency
      parameters:
        - name: base
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 3 }
      responses:
        "200":
          description: Current rate table and source timestamps for supported currencies
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletFxRateList" }
        "503": { description: A complete current rate table is unavailable }
        "422": { description: SLL rates are not available until its legacy amount scale is verified }
  /wallets/fx-quote:
    get:
      operationId: getMerchantWalletFxQuote
      tags: [wallets, fx]
      summary: Get a timestamped market-rate quote for an internal wallet conversion
      description: |
        Reference rates use target ISO-currency units per one source ISO-currency unit. The server prefers the configured CurrencyAPI credential, then ExchangeRate-API, Frankfurter, and the Fawaz currency-api public feed. Pairs involving SLL are rejected until Payzaapi's legacy SLL amount scale is verified; SLE rates are never substituted.
      parameters:
        - name: amount
          in: query
          required: true
          schema: { type: number, exclusiveMinimum: 0 }
        - name: from
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 3 }
        - name: to
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 3 }
        - name: idempotencyKey
          in: query
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200":
          description: Short-lived signed quote with market rate, system margin, fees, and exact wallet payout amount
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletFxQuote" }
        "503":
          description: Rate provider unavailable or rate is stale
        "422":
          description: The requested SLL FX pair is unsupported until the legacy SLL amount scale is verified
  /wallets/conversions:
    post:
      operationId: convertMerchantWalletFunds
      tags: [wallets, fx]
      summary: Convert funded wallet allocation internally using a fresh quote
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WalletConversionInput" }
      responses:
        "201":
          description: Internal wallet allocation conversion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletConversion" }
        "403": { description: Wallet conversion capability is disabled for this merchant }
        "409":
          description: Insufficient available funds or idempotency conflict
  /wallets/payout-methods:
    get:
      operationId: listMerchantWalletPayoutMethods
      tags: [payout-requests]
      summary: Discover payout methods and fees available to merchant wallet requests
      parameters:
        - name: currency
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 3 }
      responses:
        "200":
          description: Current provider methods, minimum and fees
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutMethodsResponse" }
        "503":
          description: Provider payout methods are not configured
  /wallets/payout-destinations:
    get:
      operationId: listMerchantWalletPayoutDestinations
      tags: [payout-requests]
      summary: List approved payout destinations and masked pending destination changes
      responses:
        "200":
          description: Merchant-approved destinations and their pending changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutDestinationList" }
        "403": { description: Merchant membership required }
    post:
      operationId: createMerchantWalletPayoutDestination
      tags: [payout-requests]
      summary: Request a saved payout destination change for two-person administrator review
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DestinationChangeRequestInput" }
      responses:
        "201":
          description: Immutable destination change request awaiting administrator review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutDestinationChangeRequest" }
        "403": { description: Owner or finance role and destination-change capability required }
        "409": { description: Idempotency conflict or another destination change is already pending }
  /wallets/payout-destination-changes:
    get:
      operationId: listMerchantWalletPayoutDestinationChanges
      tags: [payout-requests]
      summary: List destination change history for the current merchant
      responses:
        "200":
          description: Destination change requests with masked proposed account data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutDestinationChangeRequestList" }
        "403": { description: Merchant membership required }
  /wallets/payout-requests:
    get:
      operationId: listMerchantPayoutRequests
      tags: [payout-requests]
      summary: List merchant payout requests
      responses:
        "200":
          description: Payout requests with destination details redacted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutRequestList" }
    post:
      operationId: createMerchantPayoutRequest
      tags: [payout-requests]
      summary: Reserve funded wallet money for administrator-reviewed payout
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayoutRequestInput" }
      responses:
        "201":
          description: Reserved payout request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutRequest" }
        "403": { description: Payout request capability is disabled or caller lacks finance permission }
        "409":
          description: Insufficient available funds or idempotency conflict
  /admin/wallets:
    get:
      operationId: listAdminWallets
      tags: [wallets, admin]
      summary: List funded balances across merchant wallets
      responses:
        "200":
          description: Funded and reserved balances by merchant and currency
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminWalletList" }
  /admin/wallets/adjustments:
    post:
      operationId: adjustAdminWalletBalance
      tags: [wallets, admin]
      summary: Post an audited credit or debit to a merchant's available wallet balance
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminWalletAdjustmentRequest" }
      responses:
        "201":
          description: Balanced wallet adjustment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminWalletAdjustmentResponse" }
  /admin/wallets/settlements/confirm:
    post:
      operationId: confirmWalletSettlement
      tags: [wallets, admin]
      summary: Confirm settlement with evidence and fund only eligible net collections
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WalletSettlementConfirmationInput" }
      responses:
        "201":
          description: Settlement evidence recorded and wallet credited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletSettlementConfirmation" }
        "409":
          description: Settlement is not eligible or is already reconciled
  /admin/payout-requests:
    get:
      operationId: listAdminPayoutRequests
      tags: [payout-requests, admin]
      summary: Review merchant payout requests
      parameters:
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Payout requests with destination details redacted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutRequestList" }
  /admin/payout-destination-changes:
    get:
      operationId: listAdminWalletPayoutDestinationChanges
      tags: [payout-requests, admin]
      summary: Review merchant payout destination change requests
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/PayoutDestinationChangeStatus" }
      responses:
        "200":
          description: Pending and historical destination changes, with sensitive account data masked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutDestinationChangeRequestList" }
        "403": { description: Administrator access required }
  /admin/payout-destination-changes/{id}/approve:
    post:
      operationId: approvePayoutDestinationChange
      tags: [payout-requests, admin]
      summary: Record the first review or approve an immutable destination change with a second distinct administrator
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecondApprovalInput" }
      responses:
        "200":
          description: Destination change reviewed; the approved destination changes only after the distinct second approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutDestinationChangeRequest" }
        "403": { description: Administrator access required }
        "404": { description: Destination change request not found }
        "409": { description: "Self-approval, replay, stale status, fingerprint mismatch, or concurrent approval" }
  /admin/payout-destination-changes/{id}/reject:
    post:
      operationId: rejectPayoutDestinationChange
      tags: [payout-requests, admin]
      summary: Reject a pending immutable destination change without changing the approved destination
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayoutDestinationChangeRejectInput" }
      responses:
        "200":
          description: Destination change rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutDestinationChangeRequest" }
        "403": { description: Administrator access required }
        "404": { description: Destination change request not found }
        "409": { description: Destination change request is no longer pending }
  /admin/payout-requests/{id}/approve:
    post:
      operationId: approvePayoutRequest
      tags: [payout-requests, admin]
      summary: Record the first review or submit a reserved payout after required distinct approvals
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecondApprovalInput" }
      responses:
        "200":
          description: First review or submitted payout; uncertain outcomes retain funds on hold
