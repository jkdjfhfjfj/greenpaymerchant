      operationId: getDeveloperTransaction
      tags: [developer-api]
      summary: Read a transaction owned by the API key's merchant
      security: [{ bearerAuth: [] }]
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Merchant transaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "404": { description: Transaction not found for this merchant }
  /v1/transactions/{reference}/verify:
    post:
      operationId: verifyDeveloperTransaction
      tags: [developer-api]
