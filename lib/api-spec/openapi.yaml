        "404": { description: Merchant not found }
    put:
      operationId: updateAdminMerchantActionControls
      tags: [admin]
      summary: Update reversible per-merchant action and payout safety controls
      parameters:
        - name: merchantId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAdminMerchantControlsRequest" }
      responses:
        "200":
          description: Updated controls with current usage and limits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMerchantControlsResponse" }
        "400": { description: Invalid controls or reason }
        "403": { description: Administrator access required }
        "404": { description: Merchant not found }
  /admin/merchants/{merchantId}/status:
    post:
      operationId: setAdminMerchantStatus
      tags: [admin]
      summary: Activate or suspend a merchant with an audited reason
      parameters:
        - name: merchantId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetAdminMerchantStatusRequest" }
      responses:
        "200":
          description: Updated merchant status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMerchantStatusResponse" }
        "400": { description: Invalid status or reason }
        "403": { description: Administrator access required }
        "404": { description: Merchant not found }
  /admin/merchants/{merchantId}/application-review:
    post:
      operationId: reviewAdminMerchantApplication
      tags: [admin]
      summary: Approve a business application or request additional information
      parameters:
        - name: merchantId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewMerchantApplicationRequest" }
      responses:
        "200":
          description: Application review saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMerchantApplicationReviewResponse" }
        "409": { description: Application is not awaiting review }
  /admin/fee-schedules:
    get:
      operationId: listAdminFeeSchedules
      tags: [admin]
      summary: Read global and merchant-specific platform fee schedules
      responses:
        "200":
          description: Fee schedules
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFeeScheduleList" }
    put:
      operationId: updateAdminFeeSchedule
      tags: [admin]
      summary: Set a global default or merchant-specific fee schedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateFeeScheduleInput" }
      responses:
        "200":
          description: Saved fee schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFeeSchedule" }
  /admin/fx-rates:
    get:
      operationId: listAdminFxRates
      tags: [admin]
      summary: Read active and historical administrator-managed exchange rates
      responses:
        "200":
          description: FX rates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFxRateList" }
    post:
      operationId: createAdminFxRate
      tags: [admin]
      summary: Add an exchange rate with an effective timestamp and optional expiry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFxRateInput" }
      responses:
        "201":
          description: Exchange rate created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFxRate" }
  /admin/fx-rates/{id}:
    patch:
      operationId: updateAdminFxRate
      tags: [admin]
      summary: Change or deactivate an exchange rate
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateFxRateInput" }
      responses:
        "200":
          description: Updated exchange rate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFxRate" }
  /admin/provider-credentials:
    get:
      operationId: listAdminProviderCredentials
      tags: [admin]
      summary: Read credential readiness and masked keys for all providers
      responses:
        "200":
          description: Credential readiness, never credential values
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderCredentialList" }
  /admin/provider-credentials/{provider}:
    put:
      operationId: saveAdminProviderCredentials
      tags: [admin]
      summary: Encrypt and save or replace a provider's credentials
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [paystack, payhero, payzaapi, didit, cloudinary, currencyapi] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveProviderCredentialsInput" }
      responses:
        "200":
          description: Saved readiness and masked credential metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderCredential" }
    delete:
      operationId: deleteAdminProviderCredentials
      tags: [admin]
      summary: Delete stored credentials and disable the selected provider
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [paystack, payhero, payzaapi, didit, cloudinary, currencyapi] }
      responses:
        "204": { description: Provider credentials deleted }
  /admin/platform-settings:
    get:
      operationId: getAdminPlatformSettings
      tags: [admin]
      summary: Read platform-wide feature controls
      responses:
        "200":
          description: Platform settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformSettings" }
    patch:
      operationId: updateAdminPlatformSettings
      tags: [admin]
      summary: Enable or disable platform capabilities and onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformSettingsUpdate" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformSettings" }
  /admin/platform-settings/cloudinary-status:
    get:
      operationId: getAdminCloudinaryUploadStatus
      tags: [admin]
      summary: Read Cloudinary upload configuration status
      description: Returns only whether signed uploads are configured and the public Cloudinary cloud name, never API credentials.
      responses:
        "200":
          description: Cloudinary upload readiness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudinaryUploadStatus" }
  /admin/platform-settings/upload-signature:
    post:
      operationId: createAdminCloudinaryUploadSignature
      tags: [admin]
      summary: Create a signed Cloudinary upload for platform branding
      description: Returns signed upload parameters scoped to the server-selected platform assets folder. Never returns the Cloudinary API secret.
      responses:
        "200":
          description: Signed Cloudinary upload parameters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudinaryUploadSignature" }
        "503": { description: Cloudinary uploads are not configured }
  /admin/email-delivery/settings:
    get:
      operationId: getAdminEmailDeliverySettings
      tags: [admin]
      summary: Read transactional email readiness and durable delivery backlog
      description: Never returns provider credentials or token values.
      responses:
        "200":
          description: Email delivery settings and worker summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminEmailDeliverySettings" }
        "403": { description: Administrator access required }
    patch:
      operationId: updateAdminEmailDeliverySettings
      tags: [admin]
      summary: Update verified email sender and delivery enablement
      description: A new sender requires an explicit verification confirmation. Credentials remain in server-side secret configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminEmailDeliverySettingsUpdate" }
      responses:
        "200":
          description: Updated email delivery settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminEmailDeliverySettings" }
        "400": { description: Invalid or unverified sender address }
        "403": { description: Email delivery administrator permission required }
  /admin/email-delivery/test:
    post:
      operationId: sendAdminEmailDeliveryTest
      tags: [admin]
      summary: Explicitly send a test email to a chosen recipient
      description: Sending occurs only after this explicit signed-in administrator request, never on page load.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminEmailDeliveryTestInput" }
      responses:
        "200":
          description: Test delivery attempt result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminEmailDeliveryTestResult" }
        "403": { description: Email delivery administrator permission required }
  /admin/email-delivery/broadcast:
    post:
      operationId: sendAdminEmailBroadcast
      tags: [admin]
      summary: Queue a branded email to all verified users or one selected account
      description: Bulk broadcasts require explicit confirmation and include only verified account email addresses.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminEmailBroadcastRequest" }
      responses:
        "202":
          description: Email broadcast queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminEmailBroadcastResponse" }
        "400": { description: Invalid broadcast request or confirmation }
        "403": { description: Email delivery administrator permission required }
        "404": { description: Selected account not found }
        "413": { description: Recipient count exceeds the broadcast limit }
        "503": { description: Email delivery or Clerk account lookup is unavailable }
  /admin/email-delivery/outbox:
    get:
      operationId: listAdminEmailDeliveryOutbox
      tags: [admin]
      summary: Review transactional email queue and held legacy support receipts
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: deliveryState
          in: query
          schema: { $ref: "#/components/schemas/EmailDeliveryState" }
        - name: purpose
          in: query
          schema: { $ref: "#/components/schemas/TransactionalEmailPurpose" }
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Paginated delivery records with sensitive payloads omitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminEmailDeliveryOutboxList" }
        "403": { description: Administrator access required }
  /admin/email-delivery/outbox/{id}/retry:
    post:
      operationId: retryAdminEmailDeliveryOutboxItem
      tags: [admin]
      summary: Explicitly retry one safely retryable failed transactional message
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Updated outbox item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminEmailDeliveryOutboxItem" }
        "403": { description: Email delivery administrator permission required }
        "404": { description: Outbox item not found }
        "409": { description: "Item is sending, sent, uncertain, or held for legacy review" }
  /admin/email-delivery/outbox/legacy/{id}/review-requeue:
    post:
      operationId: reviewAndRequeueLegacySupportEmailOutboxItem
      tags: [admin]
      summary: Explicitly review and requeue one held legacy support receipt
      parameters:
        - name: id
          in: path
          required: true
          description: ID from the legacy support outbox
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegacySupportEmailOutboxReviewInput" }
      responses:
        "200":
          description: Updated legacy delivery item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminEmailDeliveryOutboxItem" }
        "403": { description: Email delivery administrator permission required }
        "404": { description: Legacy support item not found }
        "409": { description: Item is not held for explicit legacy review }
  /admin/audit-log:
    get:
      operationId: listAdminAuditLog
      tags: [admin]
      summary: Review administrative and meaningful signed-in user/API activity
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: user
          in: query
          schema: { type: string, maxLength: 128 }
        - name: action
          in: query
          schema: { type: string, maxLength: 100 }
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Immutable administrative audit history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAuditLog" }
  /public/legal-policies:
    get:
      operationId: getCurrentLegalPolicies
      tags: [legal]
      summary: Get the current published Privacy Policy and Terms of Service
      responses:
        "200":
          description: Current legal policy documents, including publication readiness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalPolicyList" }
  /merchant/legal-consent:
    get:
      operationId: getMerchantLegalConsent
      tags: [legal]
      summary: Check current published policy versions and the signed-in user's acceptance
      responses:
        "200":
          description: Consent gate state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalConsentState" }
    post:
      operationId: acceptMerchantLegalPolicies
      tags: [legal]
      summary: Record acceptance of the current Privacy Policy and Terms versions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegalConsentInput" }
      responses:
        "200":
          description: Accepted current versions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalConsentResult" }
        "409": { description: Policies changed while acceptance was being submitted }
  /admin/legal-policies:
    get:
      operationId: listAdminLegalPolicies
      tags: [legal, admin]
      summary: List policy drafts, published versions, and publication status
      responses:
        "200":
          description: Editable legal policies
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalPolicyAdminList" }
  /admin/legal-policies/{type}/draft:
    put:
      operationId: saveAdminLegalPolicyDraft
      tags: [legal, admin]
      summary: Save a policy draft without changing the live published version
      parameters:
        - { name: type, in: path, required: true, schema: { $ref: "#/components/schemas/LegalPolicyType" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegalPolicyDraftInput" }
      responses:
        "200":
          description: Saved draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalPolicyAdmin" }
  /admin/legal-policies/{type}/publish:
    post:
      operationId: publishAdminLegalPolicy
      tags: [legal, admin]
      summary: Publish the saved draft as a new immutable policy version
      parameters:
        - { name: type, in: path, required: true, schema: { $ref: "#/components/schemas/LegalPolicyType" } }
      responses:
        "200":
          description: Published policy version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalPolicyAdmin" }
        "409": { description: Draft must contain approved title and copy before publishing }
  /admin/legal-policies/{type}/versions:
    get:
      operationId: listAdminLegalPolicyVersions
      tags: [legal, admin]
      summary: List immutable published policy versions
      parameters:
        - { name: type, in: path, required: true, schema: { $ref: "#/components/schemas/LegalPolicyType" } }
      responses:
        "200":
          description: Published policy version history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalPolicyVersionList" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: merchant API key
  schemas:
    ContactTicketInput:
      type: object
      required: [name, email, subject, message]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        subject: { type: string, minLength: 3, maxLength: 180 }
        message: { type: string, minLength: 10, maxLength: 8000 }
        category: { type: string, enum: [payments, account, verification, technical, other] }
    SupportTicketInput:
      type: object
      required: [subject, message]
      properties:
        subject: { type: string, minLength: 3, maxLength: 180 }
        message: { type: string, minLength: 10, maxLength: 8000 }
        category: { type: string, enum: [payments, account, verification, technical, other] }
    EmailDeliveryState:
      type: string
      enum: [queued, sending, sent, failed, uncertain, unconfigured]
    TransactionalEmailPurpose:
      type: string
      enum: [payment_receipt, payment_success, payment_failure, payout_update, invoice_reminder, support_reply, support_receipt, team_invitation, admin_test, admin_broadcast]
    ContactTicketReceipt:
      type: object
      required: [reference, delivery]
      properties:
        reference: { type: string }
        delivery: { $ref: "#/components/schemas/EmailDeliveryState" }
    SupportTicket:
      type: object
      required: [id, reference, subject, category, status, requesterName, requesterEmail, createdAt, updatedAt, messageCount, delivery]
      properties:
        id: { type: integer }
        reference: { type: string }
        subject: { type: string }
        category: { type: string }
        status: { type: string, enum: [open, in_progress, waiting, resolved, closed] }
        requesterName: { type: string }
        requesterEmail: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        messageCount: { type: integer }
        delivery: { $ref: "#/components/schemas/EmailDeliveryState" }
    SupportMessage:
      type: object
      required: [id, ticketId, authorRole, authorName, body, createdAt, delivery]
      properties:
        id: { type: integer }
        ticketId: { type: integer }
        authorRole: { type: string, enum: [customer, admin] }
        authorName: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        delivery: { $ref: "#/components/schemas/EmailDeliveryState" }
    SupportTicketDetail:
      type: object
      required: [ticket, messages]
      properties:
        ticket: { $ref: "#/components/schemas/SupportTicket" }
        messages:
          type: array
          items: { $ref: "#/components/schemas/SupportMessage" }
    SupportTicketList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SupportTicket" }
    SupportMessageInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 8000 }
    SupportTicketStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [open, in_progress, waiting, resolved, closed] }
    Notification:
      type: object
      required: [id, type, title, body, href, createdAt, readAt]
      properties:
        id: { type: integer }
        type: { type: string, enum: [support_reply, kyc_update, payment_confirmed, payment_failed, payout_update] }
        title: { type: string }
        body: { type: string }
        href: { type: string }
        createdAt: { type: string, format: date-time }
        readAt: { type: ["string", "null"], format: date-time }
    NotificationList:
      type: object
      required: [items, unreadCount]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        unreadCount: { type: integer }
    UnreadCount:
      type: object
      required: [unreadCount]
      properties:
        unreadCount: { type: integer }
    AdminEmailDeliverySettings:
      type: object
      required: [provider, enabled, ready, fromEmail, senderVerified, tokenConfigured, worker, counts]
      properties:
        provider: { type: string, enum: [mailtrap] }
        enabled: { type: boolean }
        ready: { type: boolean }
        fromEmail: { type: ["string", "null"], format: email }
        senderVerified: { type: boolean, description: Administrator-confirmed verification status for the configured sender. }
        tokenConfigured: { type: boolean, description: Boolean only; never the provider token. }
        worker: { type: string, enum: [running, stopped, degraded] }
        counts:
          type: object
          required: [queued, sending, sent, failed, uncertain, heldForReview]
          properties:
            queued: { type: integer, minimum: 0 }
            sending: { type: integer, minimum: 0 }
            sent: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
            uncertain: { type: integer, minimum: 0 }
            heldForReview: { type: integer, minimum: 0 }
    AdminEmailDeliverySettingsUpdate:
      type: object
      description: senderVerified must be true when configuring a new sender address.
      properties:
        enabled: { type: boolean }
        fromEmail: { type: string, format: email }
        senderVerified: { type: boolean, const: true }
      additionalProperties: false
    AdminEmailDeliveryTestInput:
      type: object
      required: [recipientEmail]
      properties:
        recipientEmail: { type: string, format: email }
      additionalProperties: false
    AdminEmailDeliveryTestResult:
      type: object
      required: [accepted, deliveryState, detail]
      properties:
        accepted: { type: boolean }
        deliveryState: { type: string, enum: [sent, failed, uncertain] }
        detail: { type: string }
    AdminEmailBroadcastRequest:
      type: object
      required: [audience, subject, message, confirmAll]
      properties:
        audience: { type: string, enum: [all, user] }
        userId: { type: string, minLength: 1, maxLength: 128 }
        subject: { type: string, minLength: 2, maxLength: 160 }
        message: { type: string, minLength: 2, maxLength: 12000 }
        confirmAll: { type: boolean }
      additionalProperties: false
    AdminEmailBroadcastResponse:
      type: object
      required: [broadcastId, audience, queuedRecipients, skippedUnverified]
      properties:
        broadcastId: { type: string }
        audience: { type: string, enum: [all, user] }
        queuedRecipients: { type: integer, minimum: 0 }
        skippedUnverified: { type: integer, minimum: 0 }
    AdminEmailDeliveryOutboxItem:
      type: object
      required: [id, eventKey, purpose, recipientEmail, deliveryState, attempts, createdAt, updatedAt, nextAttemptAt, lastError, heldForReview]
      properties:
        id: { type: integer }
        eventKey: { type: string }
        purpose: { $ref: "#/components/schemas/TransactionalEmailPurpose" }
        recipientEmail: { type: string, format: email }
        deliveryState: { $ref: "#/components/schemas/EmailDeliveryState" }
        attempts: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        nextAttemptAt: { type: ["string", "null"], format: date-time }
        lastError: { type: ["string", "null"] }
        heldForReview: { type: boolean }
    LegacySupportEmailOutboxItem:
      type: object
      required: [id, eventKey, purpose, recipientEmail, deliveryState, createdAt, heldForReview]
      properties:
        id: { type: integer }
        eventKey: { type: string }
        purpose: { $ref: "#/components/schemas/TransactionalEmailPurpose" }
        recipientEmail: { type: string, format: email }
        deliveryState: { type: string, enum: [unconfigured] }
        createdAt: { type: string, format: date-time }
        heldForReview: { type: boolean, const: true }
    AdminEmailDeliveryOutboxList:
      type: object
      required: [items, legacyHeld, total, page, perPage]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminEmailDeliveryOutboxItem" }
        legacyHeld:
          type: array
          items: { $ref: "#/components/schemas/LegacySupportEmailOutboxItem" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        perPage: { type: integer, minimum: 1, maximum: 100 }
    LegacySupportEmailOutboxReviewInput:
      type: object
      required: [reviewed]
      properties:
        reviewed: { type: boolean, const: true }
      additionalProperties: false
    BusinessContact:
      type: object
      required: [businessName, contactName, email, phone, merchantStatus, kycStatus]
      properties:
        businessName: { type: string }
        contactName: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        merchantStatus: { type: string }
        kycStatus: { type: string }
    BusinessContactInput:
      type: object
      required: [contactName, email, phone]
      properties:
        contactName: { type: ["string", "null"], maxLength: 120 }
        email: { type: ["string", "null"], format: email, maxLength: 254 }
        phone: { type: ["string", "null"], maxLength: 40 }
    PlatformOperationalStatus:
      type: object
      required: [status, checkedAt, services]
      properties:
        status: { type: string, enum: [operational, degraded, unavailable] }
        checkedAt: { type: string, format: date-time }
        services:
          type: array
          items:
            type: object
            required: [name, status, description]
            properties:
              name: { type: string }
              status: { type: string, enum: [operational, degraded, unavailable] }
              description: { type: string }
    HealthStatus:
      type: object
      properties:
        status: { type: string, enum: [ok, unavailable] }
        database: { type: string, enum: [ready, unavailable] }
      required: [status, database]
