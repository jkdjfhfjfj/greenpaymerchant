      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformAdminRoleChangeInput" }
      responses:
        "200":
          description: Platform-admin assignment revoked with an audit record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformAdminUser" }
