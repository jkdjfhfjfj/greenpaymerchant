openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: International payments collection, link, payout, settlement and operations API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: dashboard
  - name: transactions
  - name: payment-links
  - name: payouts
  - name: settlements
  - name: customers
  - name: webhooks
  - name: providers
  - name: merchant
  - name: developer-api
  - name: admin
  - name: kyc
  - name: fx
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Read dashboard metrics and recent activity
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List and filter payments
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, success, failed, cancelled, refunded]
        - name: currency
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionList"
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Start a payment using the configured currency route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Payment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionCreated"
  /transactions/{reference}:
    get:
      operationId: getTransaction
      tags: [transactions]
      summary: Read a payment and its settlement status
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found
  /transactions/{reference}/verify:
    post:
      operationId: verifyTransaction
      tags: [transactions]
      summary: Verify a payment with its provider
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Verified transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
  /transactions/{reference}/refund:
    post:
      operationId: refundTransaction
      tags: [transactions]
      summary: Record a full or partial refund
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundInput"
      responses:
        "201":
          description: Refund created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
  /payment-links:
    get:
      operationId: listPaymentLinks
      tags: [payment-links]
      summary: List payment links
      parameters:
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Payment links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLinkList"
    post:
      operationId: createPaymentLink
      tags: [payment-links]
      summary: Create a fixed-price or customer-entered payment link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentLinkInput"
      responses:
        "201":
          description: Link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLink"
  /payment-links/{id}:
    patch:
      operationId: updatePaymentLink
      tags: [payment-links]
      summary: Update or pause a payment link
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentLinkUpdate"
      responses:
        "200":
          description: Updated link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLink"
    delete:
      operationId: deletePaymentLink
      tags: [payment-links]
      summary: Archive a payment link
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Archived
  /public/payment-links/{slug}:
    get:
      operationId: getPublicPaymentLink
      tags: [payment-links]
      summary: Read a public payment link
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public payment link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPaymentLink"
        "404":
          description: Not found
  /public/payment-links/{slug}/checkout:
    post:
      operationId: checkoutPaymentLink
      tags: [payment-links]
      summary: Start a checkout session for a public payment link
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentLinkCheckoutInput"
      responses:
        "201":
          description: Checkout session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionCreated"
  /public/transactions/{reference}:
    get:
      operationId: getPublicTransactionStatus
      tags: [transactions]
      summary: Verify a transaction for its customer checkout return
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public-safe payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicTransactionStatus"
        "404":
          description: Not found
  /payouts:
    get:
      operationId: listPayouts
      tags: [payouts]
      summary: List payouts
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, approved, completed, rejected, failed]
        - name: currency
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Payouts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutList"
    post:
      operationId: createPayout
      tags: [payouts]
      summary: Send a payout through an available Payzaapi payout method
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayoutInput"
      responses:
        "201":
          description: Payout submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payout"
  /payout-methods:
    get:
      operationId: listPayoutMethods
      tags: [payouts]
      summary: Discover methods, minimums and fees from Payzaapi
      parameters:
        - name: currency
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Current payout methods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutMethodsResponse"
  /banks:
    get:
      operationId: listBanks
      tags: [payouts]
      summary: List banks for a country
      parameters:
        - name: country
          in: query
          schema: { type: string, default: KE }
      responses:
        "200":
          description: Banks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankList"
  /settlements:
    get:
      operationId: listSettlements
      tags: [settlements]
      summary: List T+3 expected settlements
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, due, settled, held]
        - name: currency
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Settlement ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementList"
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List customers with payment totals
      parameters:
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerList"
  /webhook-events:
    get:
      operationId: listWebhookEvents
      tags: [webhooks]
      summary: Review incoming provider webhooks
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [processed, failed, ignored]
      responses:
        "200":
          description: Webhook events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEventList"
  /webhook-events/{id}/replay:
    post:
      operationId: replayWebhookEvent
      tags: [webhooks]
      summary: Reprocess a stored webhook event
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Replayed event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEvent"
  /providers/status:
    get:
      operationId: getProviderStatus
      tags: [providers]
      summary: Check provider setup without revealing secrets
      responses:
        "200":
          description: Provider readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderStatusList"
  /me:
    get:
      operationId: getAccessProfile
      tags: [merchant]
      summary: Resolve the signed-in user and their merchant or admin access
      responses:
        "200":
          description: User access profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessProfile" }
  /merchant:
    get:
      operationId: getMerchantProfile
      tags: [merchant]
      summary: Read the current user's merchant profile
      responses:
        "200":
          description: Merchant profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantProfileResponse" }
        "404": { description: Merchant onboarding is not complete }
    post:
      operationId: createMerchantProfile
      tags: [merchant]
      summary: Create a merchant workspace for the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMerchantInput" }
      responses:
        "201":
          description: Merchant created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantProfileResponse" }
        "409": { description: Merchant already exists }
  /merchant/kyc:
    get:
      operationId: getMerchantKyc
      tags: [kyc]
      summary: Read the merchant's verification status
      responses:
        "200":
          description: Verification status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycStatus" }
    post:
      operationId: createMerchantKycSession
      tags: [kyc]
      summary: Create a hosted Didit identity or business verification session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateKycSessionInput" }
      responses:
        "201":
          description: Didit hosted verification session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycSessionResponse" }
        "503": { description: Didit credentials or workflow are not configured }
  /merchant/transactions:
    get:
      operationId: listMerchantTransactions
      tags: [merchant]
      summary: List transactions belonging to the current merchant only
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Merchant transactions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionList" }
  /merchant/payouts:
    get:
      operationId: listMerchantPayouts
      tags: [merchant]
      summary: Read administrator-operated payouts attributed to the current merchant
      responses:
        "200":
          description: Owned payout history, not a withdrawable wallet balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutList" }
  /merchant/payment-links:
    get:
      operationId: listMerchantPaymentLinks
      tags: [merchant]
      summary: List payment links belonging to the current merchant
      responses:
        "200":
          description: Merchant payment links
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentLinkList" }
    post:
      operationId: createMerchantPaymentLink
      tags: [merchant]
      summary: Create a payment link for the current merchant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentLinkInput" }
      responses:
        "201":
          description: Merchant payment link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentLink" }
  /merchant/payment-links/{id}:
    patch:
      operationId: updateMerchantPaymentLink
      tags: [merchant]
      summary: Update a payment link owned by the current merchant
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentLinkUpdate" }
      responses:
        "200":
          description: Updated payment link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentLink" }
        "404": { description: Link does not exist for this merchant }
    delete:
      operationId: deleteMerchantPaymentLink
      tags: [merchant]
      summary: Archive a payment link owned by the current merchant
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Link archived }
  /merchant/api-keys:
    get:
      operationId: listMerchantApiKeys
      tags: [merchant]
      summary: List masked developer API keys for the current merchant
      responses:
        "200":
          description: API keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyList" }
    post:
      operationId: createMerchantApiKey
      tags: [merchant]
      summary: Create a scoped developer API key (secret returned only once)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApiKeyInput" }
      responses:
        "201":
          description: API key created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedApiKey" }
  /merchant/api-keys/{id}:
    delete:
      operationId: revokeMerchantApiKey
      tags: [merchant]
      summary: Revoke an API key belonging to the current merchant
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: API key revoked }
  /merchant/webhook-endpoints:
    get:
      operationId: listMerchantWebhookEndpoints
      tags: [merchant]
      summary: List the current merchant's outbound webhook endpoints
      responses:
        "200":
          description: Webhook endpoints
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpointList" }
    post:
      operationId: createMerchantWebhookEndpoint
      tags: [merchant]
      summary: Add a signed outbound webhook destination
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWebhookEndpointInput" }
      responses:
        "201":
          description: Destination created; signing secret is returned once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedWebhookEndpoint" }
  /merchant/webhook-endpoints/{id}:
    delete:
      operationId: deleteMerchantWebhookEndpoint
      tags: [merchant]
      summary: Disable an outbound webhook destination owned by the current merchant
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Destination removed }
  /merchant/fees:
    get:
      operationId: getMerchantFees
      tags: [merchant]
      summary: Read the active merchant fee schedule
      responses:
        "200":
          description: Fee schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeScheduleResponse" }
  /merchant/fx-quote:
    get:
      operationId: getMerchantFxQuote
      tags: [fx]
      summary: Convert a payment amount using an active administrator-managed FX rate
      parameters:
        - name: amount
          in: query
          required: true
          schema: { type: number, exclusiveMinimum: 0 }
        - name: from
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 3 }
        - name: to
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 3 }
      responses:
        "200":
          description: FX quote and applied fee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FxQuote" }
        "404": { description: No active exchange rate is available }
  /v1/merchant:
    get:
      operationId: getDeveloperMerchant
      tags: [developer-api]
      summary: Read the merchant tied to the supplied developer API key
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Merchant profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantProfileResponse" }
  /v1/payment-links:
    get:
      operationId: listDeveloperPaymentLinks
      tags: [developer-api]
      summary: List payment links belonging to the API key's merchant
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Merchant payment links
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentLinkList" }
    post:
      operationId: createDeveloperPaymentLink
      tags: [developer-api]
      summary: Create a payment link for the API key's merchant
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentLinkInput" }
      responses:
        "201":
          description: Payment link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentLink" }
  /v1/transactions:
    get:
      operationId: listDeveloperTransactions
      tags: [developer-api]
      summary: List transactions belonging to the API key's merchant
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Merchant transactions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionList" }
    post:
      operationId: createDeveloperTransaction
      tags: [developer-api]
      summary: Start a merchant payment with a scoped key and idempotency key
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionInput" }
      responses:
        "201":
          description: Payment initiated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionCreated" }
        "409": { description: Idempotency key is in progress or was used with different input }
  /v1/transactions/{reference}:
    get:
      operationId: getDeveloperTransaction
      tags: [developer-api]
      summary: Read a transaction owned by the API key's merchant
      security: [{ bearerAuth: [] }]
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Merchant transaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "404": { description: Transaction not found for this merchant }
  /v1/transactions/{reference}/verify:
    post:
      operationId: verifyDeveloperTransaction
      tags: [developer-api]
      summary: Refresh a merchant transaction's status from its payment provider
      security: [{ bearerAuth: [] }]
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Verified merchant transaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
  /v1/fx-quote:
    get:
      operationId: getDeveloperFxQuote
      tags: [developer-api]
      summary: Calculate an FX quote using the key's merchant pricing
      security: [{ bearerAuth: [] }]
      parameters:
        - name: amount
          in: query
          required: true
          schema: { type: number, exclusiveMinimum: 0 }
        - name: from
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 3 }
        - name: to
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 3 }
      responses:
        "200":
          description: Merchant FX quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FxQuote" }
  /v1/fees:
    get:
      operationId: getDeveloperFees
      tags: [developer-api]
      summary: Read the current merchant's platform pricing
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Merchant fee schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeeScheduleResponse" }
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Read platform-wide merchant, transaction, KYC, and provider counts
      responses:
        "200":
          description: Administrative summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSummary" }
  /admin/merchants:
    get:
      operationId: listAdminMerchants
      tags: [admin]
      summary: Search and filter all merchant accounts
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [pending, active, suspended, closed] }
        - name: kycStatus
          in: query
          schema: { type: string, enum: [not_started, pending, approved, declined, in_review, expired] }
      responses:
        "200":
          description: Merchant accounts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMerchantList" }
  /admin/merchants/{id}:
    patch:
      operationId: updateAdminMerchant
      tags: [admin]
      summary: Activate, suspend, close, or update a merchant account
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminMerchantUpdate" }
      responses:
        "200":
          description: Updated merchant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMerchant" }
  /admin/fee-schedules:
    get:
      operationId: listAdminFeeSchedules
      tags: [admin]
      summary: Read global and merchant-specific platform fee schedules
      responses:
        "200":
          description: Fee schedules
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFeeScheduleList" }
    put:
      operationId: updateAdminFeeSchedule
      tags: [admin]
      summary: Set a global default or merchant-specific fee schedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateFeeScheduleInput" }
      responses:
        "200":
          description: Saved fee schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFeeSchedule" }
  /admin/fx-rates:
    get:
      operationId: listAdminFxRates
      tags: [admin]
      summary: Read active and historical administrator-managed exchange rates
      responses:
        "200":
          description: FX rates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFxRateList" }
    post:
      operationId: createAdminFxRate
      tags: [admin]
      summary: Add an exchange rate with an effective timestamp and optional expiry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFxRateInput" }
      responses:
        "201":
          description: Exchange rate created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFxRate" }
  /admin/fx-rates/{id}:
    patch:
      operationId: updateAdminFxRate
      tags: [admin]
      summary: Change or deactivate an exchange rate
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateFxRateInput" }
      responses:
        "200":
          description: Updated exchange rate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFxRate" }
  /admin/provider-credentials:
    get:
      operationId: listAdminProviderCredentials
      tags: [admin]
      summary: Read credential readiness and masked keys for all providers
      responses:
        "200":
          description: Credential readiness, never credential values
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderCredentialList" }
  /admin/provider-credentials/{provider}:
    put:
      operationId: saveAdminProviderCredentials
      tags: [admin]
      summary: Encrypt and save or replace a provider's credentials
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [paystack, payhero, payzaapi, didit] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveProviderCredentialsInput" }
      responses:
        "200":
          description: Saved readiness and masked credential metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderCredential" }
    delete:
      operationId: deleteAdminProviderCredentials
      tags: [admin]
      summary: Delete stored credentials and disable the selected provider
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [paystack, payhero, payzaapi, didit] }
      responses:
        "204": { description: Provider credentials deleted }
  /admin/platform-settings:
    get:
      operationId: getAdminPlatformSettings
      tags: [admin]
      summary: Read platform-wide feature controls
      responses:
        "200":
          description: Platform settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformSettings" }
    patch:
      operationId: updateAdminPlatformSettings
      tags: [admin]
      summary: Enable or disable platform capabilities and onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformSettingsUpdate" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformSettings" }
  /admin/audit-log:
    get:
      operationId: listAdminAuditLog
      tags: [admin]
      summary: Review privileged account, fee, FX, settings, and credential changes
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        "200":
          description: Immutable administrative audit history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAuditLog" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: merchant API key
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    DashboardSummary:
      type: object
      required: [paymentsToday, successRate, pendingSettlements, settlementsDue, volumeByCurrency, recentTransactions, providerStatus]
      properties:
        paymentsToday: { type: integer }
        successRate: { type: number }
        pendingSettlements: { type: integer }
        settlementsDue: { type: integer }
        volumeByCurrency:
          type: array
          items: { $ref: "#/components/schemas/CurrencyVolume" }
        recentTransactions:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
        providerStatus:
          type: array
          items: { $ref: "#/components/schemas/ProviderStatus" }
    CurrencyVolume:
      type: object
      required: [currency, amount, count]
      properties:
        currency: { type: string }
        amount: { type: number }
        count: { type: integer }
    Transaction:
      type: object
      required: [id, reference, amount, currency, status, provider, customerEmail, createdAt, settlementStatus]
      properties:
        id: { type: integer }
        reference: { type: string }
        amount: { type: number }
        fee: { type: ["number", "null"] }
        netAmount: { type: ["number", "null"] }
        currency: { type: string }
        status:
          type: string
          enum: [pending, success, failed, cancelled, refunded]
        provider: { type: string, enum: [paystack, payhero, payzaapi] }
        paymentMethod: { type: ["string", "null"] }
        customerEmail: { type: string }
        customerName: { type: ["string", "null"] }
        customerPhone: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        providerReference: { type: ["string", "null"] }
        paymentUrl: { type: ["string", "null"] }
        paymentLinkId: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }
        paidAt: { type: ["string", "null"], format: date-time }
        settlementAt: { type: ["string", "null"], format: date-time }
        settlementStatus:
          type: string
          enum: [pending, due, settled, held, not_applicable]
    TransactionList:
      type: object
      required: [items, total, page, perPage]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
        total: { type: integer }
        page: { type: integer }
        perPage: { type: integer }
    TransactionInput:
      type: object
      required: [amount, currency, customerEmail]
      properties:
        amount: { type: number, exclusiveMinimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        customerEmail: { type: string, format: email }
        customerName: { type: string }
        customerPhone: { type: string }
        description: { type: string }
        paymentLinkId: { type: integer }
    TransactionCreated:
      type: object
      required: [transaction, checkoutUrl]
      properties:
        transaction: { $ref: "#/components/schemas/Transaction" }
        checkoutUrl: { type: ["string", "null"], format: uri }
    PublicTransactionStatus:
      type: object
      required: [reference, status, amount, currency, provider, createdAt]
      properties:
        reference: { type: string }
        status:
          type: string
          enum: [pending, success, failed, cancelled, refunded]
        amount: { type: number }
        currency: { type: string }
        provider: { type: string, enum: [paystack, payhero, payzaapi] }
        paidAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    RefundInput:
      type: object
      properties:
        amount: { type: number, exclusiveMinimum: 0 }
        reason: { type: string }
    Refund:
      type: object
      required: [reference, originalReference, amount, currency, status, createdAt]
