openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: International payments collection, link, payout, settlement and operations API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: dashboard
  - name: transactions
  - name: payment-links
  - name: payouts
  - name: settlements
  - name: customers
  - name: webhooks
  - name: providers
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Read dashboard metrics and recent activity
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List and filter payments
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, success, failed, cancelled, refunded]
        - name: currency
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionList"
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Start a payment using the configured currency route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Payment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionCreated"
  /transactions/{reference}:
    get:
      operationId: getTransaction
      tags: [transactions]
      summary: Read a payment and its settlement status
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found
  /transactions/{reference}/verify:
    post:
      operationId: verifyTransaction
      tags: [transactions]
      summary: Verify a payment with its provider
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Verified transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
  /transactions/{reference}/refund:
    post:
      operationId: refundTransaction
      tags: [transactions]
      summary: Record a full or partial refund
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundInput"
      responses:
        "201":
          description: Refund created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
  /payment-links:
    get:
      operationId: listPaymentLinks
      tags: [payment-links]
      summary: List payment links
      parameters:
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Payment links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLinkList"
    post:
      operationId: createPaymentLink
      tags: [payment-links]
      summary: Create a fixed-price or customer-entered payment link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentLinkInput"
      responses:
        "201":
          description: Link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLink"
  /payment-links/{id}:
    patch:
      operationId: updatePaymentLink
      tags: [payment-links]
      summary: Update or pause a payment link
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentLinkUpdate"
      responses:
        "200":
          description: Updated link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLink"
    delete:
      operationId: deletePaymentLink
      tags: [payment-links]
      summary: Archive a payment link
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Archived
  /public/payment-links/{slug}:
    get:
      operationId: getPublicPaymentLink
      tags: [payment-links]
      summary: Read a public payment link
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public payment link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPaymentLink"
        "404":
          description: Not found
  /public/payment-links/{slug}/checkout:
    post:
      operationId: checkoutPaymentLink
      tags: [payment-links]
      summary: Start a checkout session for a public payment link
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentLinkCheckoutInput"
      responses:
        "201":
          description: Checkout session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionCreated"
  /public/transactions/{reference}:
    get:
      operationId: getPublicTransactionStatus
      tags: [transactions]
      summary: Verify a transaction for its customer checkout return
      parameters:
        - name: reference
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public-safe payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicTransactionStatus"
        "404":
          description: Not found
  /payouts:
    get:
      operationId: listPayouts
      tags: [payouts]
      summary: List payouts
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, approved, completed, rejected, failed]
        - name: currency
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Payouts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutList"
    post:
      operationId: createPayout
      tags: [payouts]
      summary: Send a payout through an available Payzaapi payout method
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayoutInput"
      responses:
        "201":
          description: Payout submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payout"
  /payout-methods:
    get:
      operationId: listPayoutMethods
      tags: [payouts]
      summary: Discover methods, minimums and fees from Payzaapi
      parameters:
        - name: currency
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Current payout methods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutMethodsResponse"
  /banks:
    get:
      operationId: listBanks
      tags: [payouts]
      summary: List banks for a country
      parameters:
        - name: country
          in: query
          schema: { type: string, default: KE }
      responses:
        "200":
          description: Banks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankList"
  /settlements:
    get:
      operationId: listSettlements
      tags: [settlements]
      summary: List T+3 expected settlements
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, due, settled, held]
        - name: currency
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Settlement ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementList"
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List customers with payment totals
      parameters:
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerList"
  /webhook-events:
    get:
      operationId: listWebhookEvents
      tags: [webhooks]
      summary: Review incoming provider webhooks
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [processed, failed, ignored]
      responses:
        "200":
          description: Webhook events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEventList"
  /webhook-events/{id}/replay:
    post:
      operationId: replayWebhookEvent
      tags: [webhooks]
      summary: Reprocess a stored webhook event
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Replayed event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEvent"
  /providers/status:
    get:
      operationId: getProviderStatus
      tags: [providers]
      summary: Check provider setup without revealing secrets
      responses:
        "200":
          description: Provider readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderStatusList"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    DashboardSummary:
      type: object
      required: [paymentsToday, successRate, pendingSettlements, settlementsDue, volumeByCurrency, recentTransactions, providerStatus]
      properties:
        paymentsToday: { type: integer }
        successRate: { type: number }
        pendingSettlements: { type: integer }
        settlementsDue: { type: integer }
        volumeByCurrency:
          type: array
          items: { $ref: "#/components/schemas/CurrencyVolume" }
        recentTransactions:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
        providerStatus:
          type: array
          items: { $ref: "#/components/schemas/ProviderStatus" }
    CurrencyVolume:
      type: object
      required: [currency, amount, count]
      properties:
        currency: { type: string }
        amount: { type: number }
        count: { type: integer }
    Transaction:
      type: object
      required: [id, reference, amount, currency, status, provider, customerEmail, createdAt, settlementStatus]
      properties:
        id: { type: integer }
        reference: { type: string }
        amount: { type: number }
        fee: { type: ["number", "null"] }
        netAmount: { type: ["number", "null"] }
        currency: { type: string }
        status:
          type: string
          enum: [pending, success, failed, cancelled, refunded]
        provider: { type: string, enum: [paystack, payhero, payzaapi] }
        paymentMethod: { type: ["string", "null"] }
        customerEmail: { type: string }
        customerName: { type: ["string", "null"] }
        customerPhone: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        providerReference: { type: ["string", "null"] }
        paymentUrl: { type: ["string", "null"] }
        paymentLinkId: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }
        paidAt: { type: ["string", "null"], format: date-time }
        settlementAt: { type: ["string", "null"], format: date-time }
        settlementStatus:
          type: string
          enum: [pending, due, settled, held, not_applicable]
    TransactionList:
      type: object
      required: [items, total, page, perPage]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
        total: { type: integer }
        page: { type: integer }
        perPage: { type: integer }
    TransactionInput:
      type: object
      required: [amount, currency, customerEmail]
      properties:
        amount: { type: number, exclusiveMinimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        customerEmail: { type: string, format: email }
        customerName: { type: string }
        customerPhone: { type: string }
        description: { type: string }
        paymentLinkId: { type: integer }
    TransactionCreated:
      type: object
      required: [transaction, checkoutUrl]
      properties:
        transaction: { $ref: "#/components/schemas/Transaction" }
        checkoutUrl: { type: ["string", "null"], format: uri }
    PublicTransactionStatus:
      type: object
      required: [reference, status, amount, currency, provider, createdAt]
      properties:
        reference: { type: string }
        status:
          type: string
          enum: [pending, success, failed, cancelled, refunded]
        amount: { type: number }
        currency: { type: string }
        provider: { type: string, enum: [paystack, payhero, payzaapi] }
        paidAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    RefundInput:
      type: object
      properties:
        amount: { type: number, exclusiveMinimum: 0 }
        reason: { type: string }
    Refund:
      type: object
      required: [reference, originalReference, amount, currency, status, createdAt]
      properties:
        reference: { type: string }
        originalReference: { type: string }
        amount: { type: number }
        currency: { type: string }
        status: { type: string }
        reason: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    PaymentLink:
      type: object
      required: [id, slug, name, amountType, currency, status, url, paidCount, createdAt]
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
        amountType: { type: string, enum: [fixed, customer_choice] }
        amount: { type: ["number", "null"] }
        currency: { type: string }
        status: { type: string, enum: [active, paused, archived] }
        url: { type: string, format: uri }
        paidCount: { type: integer }
        totalPaid: { type: number }
        expiresAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    PaymentLinkList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PaymentLink" }
    PaymentLinkInput:
      type: object
      required: [name, amountType, currency]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        amountType: { type: string, enum: [fixed, customer_choice] }
        amount: { type: number, exclusiveMinimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        expiresAt: { type: string, format: date-time }
    PaymentLinkUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        status: { type: string, enum: [active, paused] }
        expiresAt: { type: ["string", "null"], format: date-time }
    PublicPaymentLink:
      type: object
      required: [slug, name, amountType, currency, provider]
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: ["string", "null"] }
        amountType: { type: string, enum: [fixed, customer_choice] }
        amount: { type: ["number", "null"] }
        currency: { type: string }
        provider: { type: string, enum: [paystack, payhero, payzaapi] }
        expiresAt: { type: ["string", "null"], format: date-time }
    PaymentLinkCheckoutInput:
      type: object
      required: [customerEmail]
      properties:
        amount: { type: number, exclusiveMinimum: 0 }
        customerEmail: { type: string, format: email }
        customerName: { type: string }
        customerPhone: { type: string }
    Payout:
      type: object
      required: [id, reference, amount, currency, method, accountName, status, provider, createdAt]
      properties:
        id: { type: integer }
        reference: { type: string }
        amount: { type: number }
        fee: { type: ["number", "null"] }
        netAmount: { type: ["number", "null"] }
        currency: { type: string }
        method: { type: string }
        accountName: { type: string }
        maskedAccount: { type: string }
        status:
          type: string
          enum: [pending, processing, approved, completed, rejected, failed]
        provider: { type: string, enum: [payzaapi, paystack] }
        createdAt: { type: string, format: date-time }
    PayoutList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Payout" }
    PayoutInput:
      type: object
      required: [amount, currency, method, accountNumber, accountName]
      properties:
        amount: { type: number, exclusiveMinimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        method: { type: string }
        accountNumber: { type: string, minLength: 3 }
        accountName: { type: string, minLength: 1 }
        bankCode: { type: string }
        bankName: { type: string }
    PayoutMethodsResponse:
      type: object
      required: [currency, available, minimumWithdrawal, fee, methods]
      properties:
        currency: { type: string }
        available: { type: boolean }
        minimumWithdrawal: { type: number }
        fee:
          type: object
          required: [type]
          properties:
            type: { type: string, enum: [flat, percent] }
            amount: { type: number }
            percent: { type: ["number", "null"] }
            floor: { type: ["number", "null"] }
        methods:
          type: array
          items: { $ref: "#/components/schemas/PayoutMethod" }
    PayoutMethod:
      type: object
      required: [value, label, requiresBankFields]
      properties:
        value: { type: string }
        label: { type: string }
        requiresBankFields: { type: boolean }
    Bank:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    BankList:
      type: object
      required: [banks]
      properties:
        banks:
          type: array
          items: { $ref: "#/components/schemas/Bank" }
    Settlement:
      type: object
      required: [id, reference, provider, amount, netAmount, currency, status, expectedAt]
      properties:
        id: { type: integer }
        reference: { type: string }
        provider: { type: string, enum: [paystack, payhero, payzaapi] }
        amount: { type: number }
        netAmount: { type: number }
        currency: { type: string }
        status: { type: string, enum: [pending, due, settled, held] }
        expectedAt: { type: string, format: date-time }
        settledAt: { type: ["string", "null"], format: date-time }
        payoutMethod: { type: ["string", "null"] }
    SettlementList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Settlement" }
    Customer:
      type: object
      required: [id, name, email, orderCount, currencySummary]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        orderCount: { type: integer }
        currencySummary: { type: string }
        lastPaymentAt: { type: ["string", "null"], format: date-time }
    CustomerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Customer" }
    WebhookEvent:
      type: object
      required: [id, provider, event, status, attempts, receivedAt]
      properties:
        id: { type: integer }
        provider: { type: string }
        event: { type: string }
        reference: { type: ["string", "null"] }
        status: { type: string, enum: [processed, failed, ignored] }
        httpStatus: { type: ["integer", "null"] }
        attempts: { type: integer }
        receivedAt: { type: string, format: date-time }
        lastError: { type: ["string", "null"] }
    WebhookEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WebhookEvent" }
    ProviderStatus:
      type: object
      required: [provider, configured, mode, currencies, collectionsEnabled, payoutsEnabled]
      properties:
        provider: { type: string, enum: [paystack, payhero, payzaapi] }
        configured: { type: boolean }
        mode: { type: string, enum: [test, live, unknown] }
        currencies:
          type: array
          items: { type: string }
        collectionsEnabled: { type: boolean }
        payoutsEnabled: { type: boolean }
        note: { type: string }
    ProviderStatusList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProviderStatus" }