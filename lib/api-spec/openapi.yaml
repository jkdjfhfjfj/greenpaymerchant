    PlatformSettings:
      type: object
      required: [newMerchantSignups, paymentsEnabled, payoutsEnabled, refundsEnabled, apiAccessEnabled, kycRequired]
      properties:
        newMerchantSignups: { type: boolean }
        paymentsEnabled: { type: boolean }
        payoutsEnabled: { type: boolean }
        refundsEnabled: { type: boolean }
        apiAccessEnabled: { type: boolean }
        kycRequired: { type: boolean }
    PlatformSettingsUpdate:
      type: object
      properties:
        newMerchantSignups: { type: boolean }
        paymentsEnabled: { type: boolean }
        payoutsEnabled: { type: boolean }
        refundsEnabled: { type: boolean }
        apiAccessEnabled: { type: boolean }
        kycRequired: { type: boolean }
    AdminAuditLog:
      type: object
      required: [items, page, total]
      properties:
        page: { type: integer }
        total: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [id, actor, action, target, createdAt]
            properties:
              id: { type: integer }
              actor: { type: string }
              action: { type: string }
              target: { type: string }
              details: { type: string }
              createdAt: { type: string, format: date-time }