        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentLinkUpdate" }
      responses:
        "200":
          description: Updated payment link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentLink" }
