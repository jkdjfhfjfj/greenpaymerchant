        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Merchant transactions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionList" }
