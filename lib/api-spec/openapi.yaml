      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MerchantTeamRoleUpdate" }
      responses:
        "200":
          description: Updated team member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantTeamMember" }
        "403": { description: Owner permission required }
        "404": { description: Member not found for this merchant }
    delete:
      operationId: removeMerchantTeamMember
      tags: [merchant]
      summary: Remove a team member without affecting the merchant owner
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Team member removed }
        "404": { description: Member not found for this merchant }
  /merchant/team/accept:
    post:
      operationId: acceptMerchantTeamInvitation
      tags: [merchant]
      summary: Accept an invitation matching the signed-in verified email
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MerchantTeamInvitationAcceptanceInput" }
      responses:
        "200":
          description: Invitation accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantTeamInvitationAcceptance" }
        "403": { description: Invitation email does not match the signed-in verified email }
        "409": { description: Invitation is no longer pending }
  /merchant/api-keys:
    get:
      operationId: listMerchantApiKeys
      tags: [merchant]
      summary: List masked developer API keys for the current merchant
      responses:
        "200":
          description: API keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyList" }
    post:
      operationId: createMerchantApiKey
      tags: [merchant]
      summary: Create a scoped developer API key (secret returned only once)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApiKeyInput" }
      responses:
        "201":
          description: API key created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedApiKey" }
  /merchant/api-keys/{id}:
    delete:
      operationId: revokeMerchantApiKey
      tags: [merchant]
      summary: Revoke an API key belonging to the current merchant
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: API key revoked }
  /merchant/webhook-endpoints:
    get:
      operationId: listMerchantWebhookEndpoints
      tags: [merchant]
      summary: List the current merchant's outbound webhook endpoints
      responses:
        "200":
          description: Webhook endpoints
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpointList" }
    post:
      operationId: createMerchantWebhookEndpoint
      tags: [merchant]
      summary: Add a signed outbound webhook destination
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWebhookEndpointInput" }
      responses:
        "201":
          description: Destination created; signing secret is returned once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedWebhookEndpoint" }
  /merchant/webhook-endpoints/{id}:
    delete:
      operationId: deleteMerchantWebhookEndpoint
      tags: [merchant]
      summary: Disable an outbound webhook destination owned by the current merchant
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Destination removed }
  /merchant/webhook-deliveries:
    get:
      operationId: listMerchantWebhookDeliveries
      tags: [merchant]
      summary: Review outbound webhook delivery attempts for the current merchant
      responses:
        "200":
          description: Recent delivery attempts
