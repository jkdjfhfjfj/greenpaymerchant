  /merchant/team/invitations/{id}:
    delete:
      operationId: revokeMerchantTeamInvitation
      tags: [merchant]
      summary: Revoke a pending team invitation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Invitation revoked }
        "404": { description: Invitation not found for this merchant }
  /merchant/team/members/{id}:
    patch:
      operationId: updateMerchantTeamMember
