        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Payment-link reminder history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentLinkReminderList" }
    post:
      operationId: createMerchantPaymentLinkReminder
      tags: [merchant]
      summary: Send or schedule a reminder for an active unpaid payment link
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentLinkReminderInput" }
      responses:
        "201":
          description: Persisted reminder request and delivery state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentLinkReminder" }
        "409": { description: Link is not active or has expired }
  /merchant/team:
