      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MerchantTeamInvitationInput" }
      responses:
        "201":
          description: Invitation created; copy the returned link to deliver it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantTeamInvitationCreated" }
