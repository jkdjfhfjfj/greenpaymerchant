services:
  - type: web
    name: greenpay
    runtime: node
    plan: free
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm run build:render
    startCommand: "PORT=${PORT:-10000} pnpm run start:render"
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: trace
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_SOURCE
        value: external
      - key: EXTERNAL_DATABASE_URL
        fromDatabase:
          name: greenpay-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CREDENTIALS_ENCRYPTION_KEY
        generateValue: true
      - key: PUBLIC_APP_URL
        value: https://greenpay.co.ke
      - key: PUBLIC_SITE_URL
        sync: false
      - key: VITE_PUBLIC_SITE_URL
        sync: false
      - key: ADMIN_EMAILS
        value: ceeejaaay50@gmail.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://greenpay.co.ke
      - key: FROM_EMAIL
        sync: false
      - key: CLERK_PROVIDER_MODE
        value: external
      - key: VITE_CLERK_PROVIDER_MODE
        value: external
      - key: EXTERNAL_CLERK_SECRET_KEY
        sync: false
      - key: VITE_EXTERNAL_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: LEGACY_CLERK_SECRET_KEY
        sync: false
      - key: MAILTRAP_API_TOKEN
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYHERO_BASIC_AUTH
        sync: false
      - key: PAYHERO_CHANNEL_ID
        sync: false
      - key: PAYZAAPI_API_KEY
        sync: false
      - key: PAYZA_PUBLIC_KEY
        sync: false
      - key: PAYZA_SECRET_KEY
        sync: false
      - key: PAYZA_WEBHOOK_SECRET
        sync: false
      - key: DIDIT_API_KEY
        sync: false
      - key: DIDIT_WEBHOOK_SECRET
        sync: false
      - key: DIDIT_WORKFLOW_ID
        sync: false
      - key: DIDIT_KYB_WORKFLOW_ID
        sync: false
      - key: CURRENCYAPI_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: greenpay-db
    databaseName: greenpay
    user: greenpay
    plan: free
    region: singapore