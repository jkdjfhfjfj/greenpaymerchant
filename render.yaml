services:
  - type: web
    name: greenpay
    runtime: node
    plan: free
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm run build:render
    startCommand: pnpm run start:render
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_SOURCE
        value: external
      - key: EXTERNAL_DATABASE_URL
        fromDatabase:
          name: greenpay-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_APP_URL
        sync: false
      - key: CLERK_AUTH_MODE
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: EXTERNAL_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: EXTERNAL_CLERK_SECRET_KEY
        sync: false
      - key: VITE_EXTERNAL_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: MAILTRAP_API_TOKEN
        sync: false
      - key: DIDIT_API_KEY
        sync: false
      - key: DIDIT_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: greenpay-db
    databaseName: greenpay
    user: greenpay
    plan: free
    region: singapore